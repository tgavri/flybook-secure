version: '3'

networks:
  localnetwork:

services:
  db:
    image: "mysql:8.4"                       # supported LTS (F14, CWE-1104)
    restart: always
    environment:
      # Secrets come from .env (git-ignored), nothing hardcoded (F10, CWE-798)
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=flybook
      - MYSQL_USER=flybook_app                # non-root app user (F10, CWE-250)
      - MYSQL_PASSWORD=${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"                 # loopback only, not all interfaces (F11, CWE-668)
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    networks: [localnetwork]
    security_opt:
      - "no-new-privileges:true"

  web:
    build: .
    environment:
      - DB_SERVER=db
      - DB_USER=flybook_app                   # app connects as the least-priv user, not root
      - DB_PASSWORD=${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
      - DB_NAME=flybook
      - API_KEY=${API_KEY:?set API_KEY in .env}
    ports:
      - "127.0.0.1:8000:80"                   # loopback only; put a TLS reverse proxy in front (F13, CWE-319)
    networks: [localnetwork]
    cap_drop: [ALL]                           # drop Linux capabilities (F12)
    security_opt:
      - "no-new-privileges:true"
